<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Tienda FastAPI & MongoDB{% endblock %}</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>

    <!-- Header / Navbar -->
    <header class="app-header">
        <div class="nav-container">
            <a href="{% url 'lista_productos' %}" class="brand-logo">
                <div class="brand-icon">📦</div>
                <span>Taller 2 APIFAST</span>
            </a>

            <nav>
                <ul class="nav-links">
                    <li>
                        <a href="{% url 'lista_productos' %}" class="nav-link-custom {% if request.resolver_match.url_name in 'lista_productos,crear_producto,editar_producto,eliminar_producto' %}active{% endif %}">
                            <span>🏷️</span> Productos
                        </a>
                    </li>
                    <li>
                        <a href="{% url 'lista_pedidos' %}" class="nav-link-custom {% if request.resolver_match.url_name in 'lista_pedidos,crear_pedido' %}active{% endif %}">
                            <span>📋</span> Pedidos
                        </a>
                    </li>
                </ul>
            </nav>

            <div class="backend-badge">
                <span class="status-dot"></span>
                <span>FastAPI + MongoDB</span>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="main-wrapper">
        {% if error %}
        <div style="background: #fef2f2; border: 1.5px solid #fecaca; color: #991b1b; padding: 1rem 1.25rem; border-radius: var(--radius-md); margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.75rem; box-shadow: var(--shadow-sm);">
            <span style="font-size: 1.5rem;">⚠️</span>
            <div>
                <strong>Aviso de Conexión:</strong>
                <div>{{ error }}</div>
            </div>
        </div>
        {% endif %}

        {% block content %}
        {% endblock %}
    </main>

    {% block extra_scripts %}
    {% endblock %}
</body>
</html>
