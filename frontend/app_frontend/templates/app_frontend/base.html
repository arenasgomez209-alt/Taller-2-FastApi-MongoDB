<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Taller 2 · FastAPI + MongoDB + Django{% endblock %}</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>

    <!-- Header / Navbar -->
    <header class="app-header">
        <div class="nav-container">
            <a href="{% url 'lista_productos' %}" class="brand-logo">
                <div class="brand-icon">📦</div>
                <div class="brand-title-wrap">
                    <span class="brand-title">Catálogo Pro</span>
                    <span class="brand-subtitle">FastAPI & MongoDB</span>
                </div>
            </a>

            <nav>
                <ul class="nav-links">
                    <li>
                        <a href="{% url 'lista_productos' %}" class="nav-link-custom {% if request.resolver_match.url_name in 'lista_productos,crear_producto,editar_producto,eliminar_producto' %}active{% endif %}">
                            <span>🏷️</span> Catálogo
                        </a>
                    </li>
                    <li>
                        <a href="{% url 'lista_pedidos' %}" class="nav-link-custom {% if request.resolver_match.url_name in 'lista_pedidos,crear_pedido' %}active{% endif %}">
                            <span>📋</span> Pedidos
                        </a>
                    </li>
                </ul>
            </nav>

            <div class="backend-badge">
                <span class="status-dot"></span>
                <span>API Conectada</span>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="main-wrapper">
        {% if error %}
        <div style="background: #fef2f2; border: 1.5px solid #fecaca; color: #991b1b; padding: 1.15rem 1.4rem; border-radius: var(--radius-md); margin-bottom: 1.75rem; display: flex; align-items: center; gap: 0.9rem; box-shadow: var(--shadow-sm);">
            <span style="font-size: 1.6rem;">⚠️</span>
            <div>
                <strong style="font-size: 0.95rem;">Aviso de Conexión:</strong>
                <div style="font-size: 0.88rem; margin-top: 0.2rem; color: #7f1d1d;">{{ error }}</div>
            </div>
        </div>
        {% endif %}

        {% block content %}
        {% endblock %}
    </main>

    <!-- Toast Notifications Container -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- Global Helper Scripts -->
    <script>
        function showToast(message, icon = '✨') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast-message';
            toast.innerHTML = `<span>${icon}</span> <span>${message}</span>`;
            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.add('show');
            }, 20);

            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function copyToClipboard(text, label = 'ID') {
            navigator.clipboard.writeText(text).then(() => {
                showToast(`${label} copiado al portapapeles: ${text}`, '📋');
            }).catch(() => {
                showToast('No se pudo copiar el texto', '⚠️');
            });
        }
    </script>

    {% block extra_scripts %}
    {% endblock %}
</body>
</html>
